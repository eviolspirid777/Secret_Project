syntax = "proto3";

package file.v1;

option csharp_namespace = "SecretProject.Data.Contracts.File";

service FileService {
  rpc CreateUploadIntent(CreateUploadIntentRequest) returns (CreateUploadIntentResponse);
  rpc CompleteUpload(CompleteUploadRequest) returns (CompleteUploadResponse);
}

message CreateUploadIntentRequest {
  string owner_user_id = 1;
  repeated CreateUploadIntentFile files = 2;
}

message CreateUploadIntentFile {
  string file_name = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  string checksum = 4;
}

message CreateUploadIntentResponse {
  repeated UploadIntentFile files = 1;
}

message UploadIntentFile {
  string file_id = 1;
  string upload_url = 2;
  string object_key = 3;
  string expires_at_utc = 4;
}

message CompleteUploadRequest {
  string owner_user_id = 1;
  repeated string file_ids = 2;
}

message CompleteUploadResponse {
  repeated CompletedFile files = 1;
}

message CompletedFile {
  string file_id = 1;
  bool success = 2;
  string error_message = 3;
}